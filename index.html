<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>散歩ログPoC</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- <link rel="stylesheet" href="dragon-radar.css" /> -->
</head>
<body>
  <div class="map-container">
    <div id="map"></div>
    <div id="layer-toggle" class="layer-toggle">
      <label><input type="checkbox" id="toggle-ankyomap" checked> 暗渠</label>
      <label><input type="checkbox" id="toggle-route" checked> ルート</label>
      <label><input type="checkbox" id="toggle-spot" checked> スポット</label>
    </div>
    <div class="route-selector-container">
      <select id="route-selector" class="route-selector"></select>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script type="module" src="dist/main.js"></script>
  <!-- <script src="dist/dragon-radar.js"></script> -->
</body>
</html>
